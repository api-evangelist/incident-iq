aid: incident-iq
name: Incident IQ
description: >-
  Incident IQ is a K-12-purpose-built IT service management (ITSM) and asset
  management platform used by school districts to run help desk ticketing,
  device and technology asset tracking, facilities and HR service delivery,
  and operational analytics. Its RESTful API (v1.0) lets districts and partners
  build custom integrations across the district ecosystem — connecting billing
  and ticketing, pushing tickets to third-party service providers, exporting
  analytics to visualization tools, and syncing systems. Requests are
  authenticated with SiteId, Authorization, and Client (ApiClient) headers
  issued from Administration > Developer Tools, and events can be pushed to
  external systems via rule-triggered webhooks.
